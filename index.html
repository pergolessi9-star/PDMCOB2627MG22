<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Programación Didáctica 2026/2027</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Georgia, serif; max-width: 900px; margin: 0 auto; padding: 30px 20px; line-height: 1.7; color: #1f2a36; background: #fff; }
h1 { color: #1a3a5c; border-bottom: 3px solid #1a3a5c; padding-bottom: 10px; }
h2 { color: #2c5a85; margin-top: 35px; }
h3 { color: #1f2a36; }
table { border-collapse: collapse; width: 100%; margin: 20px 0; font-family: Arial, sans-serif; font-size: 0.92em; }
th, td { border: 1px solid #d8dee4; padding: 8px 12px; text-align: left; vertical-align: top; }
th { background: #1a3a5c; color: #fff; }
tr:nth-child(even) { background: #f9fbfc; }
blockquote { border-left: 4px solid #2c5a85; background: #f4f6f8; padding: 12px 20px; font-style: italic; margin: 18px 0; }
code { background: #f4f6f8; padding: 2px 6px; border-radius: 3px; font-family: Consolas, monospace; }
.hold { background: #fff4e0; color: #8a5a00; font-weight: bold; padding: 2px 8px; border-radius: 3px; border: 1px solid #e6c88a; }
.cargando { text-align: center; padding: 60px 20px; color: #1a3a5c; font-size: 1.1em; }
header { background: linear-gradient(160deg, #1a3a5c, #2c5a85); color: #fff; padding: 50px 30px; text-align: center; margin: -30px -20px 40px; }
header h1 { color: #fff; border: none; margin: 0 0 10px; font-size: 2em; letter-spacing: 2px; }
header p { margin: 5px 0; opacity: 0.95; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

<header>
  <h1>PROGRAMACIÓN DIDÁCTICA 2026/2027</h1>
  <p><strong>Música de Cámara · Orquesta · Banda</strong></p>
  <p>Enseñanzas Profesionales de Música — Extremadura</p>
</header>

<div id="contenido">
  <div class="cargando">Cargando programación…</div>
</div>

<script>
const FICHERO = './PROGRAMACION_DIDACTICA_MUSICA_CAMARA_ORQUESTA_BANDA_2026_2027_DEPURADA.md';

fetch(FICHERO)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(texto => {
    let md = texto.replace(/\bHOLD\b/g, '<span class="hold">HOLD</span>');
    document.getElementById('contenido').innerHTML = marked.parse(md, { gfm: true });
  })
  .catch(err => {
    document.getElementById('contenido').innerHTML =
      '<p style="color:#c0392b;"><strong>Error al cargar el documento:</strong> ' + err.message + '</p>' +
      '<p>Verifica que el archivo <code>PROGRAMACION_DIDACTICA_MUSICA_CAMARA_ORQUESTA_BANDA_2026_2027_DEPURADA.md</code> está en la raíz del repositorio.</p>';
  });
</script>

</body>
</html>
